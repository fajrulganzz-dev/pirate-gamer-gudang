<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirate Gamer Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <header id="in-header" class="bg-slate-800 p-4 border-b border-slate-700 hidden flex justify-between items-center">
    <h1 class="font-bold text-xl text-amber-400">🏴‍☠️ Pirate Gamer Stock</h1>
    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm">Logout</button>
  </header>

  <main class="p-4 max-w-4xl mx-auto">
    <!-- PAGE LOGIN -->
    <section id="page-login" class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md mx-auto mt-10">
      <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">Login Admin</h2>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Username / ID</label>
          <input type="text" id="login-user" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="block text-sm mb-1">Password</label>
          <input type="password" id="login-pass" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-2 rounded text-slate-900">Masuk Sistem</button>
      </form>
    </section>

    <!-- PAGE DASHBOARD -->
    <section id="page-dashboard" class="hidden space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">Daftar Stok Gudang</h2>
        <button onclick="loadStocks()" class="bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded text-sm">🔄 Refresh Data</button>
      </div>

      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="border-b border-slate-700 text-amber-400">
            <tr>
              <th class="p-2">Data / Nama Stok</th>
            </tr>
          </thead>
          <tbody id="stock-list">
            <tr><td class="p-2 text-slate-400">Tekan Refresh untuk memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // PASANG URL WEB APP LU DI SINI:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwm1d0s5eSNcqdzF8q9NEtusEiJwWGeCEz_7Y18N2cqgIf0kvt895JdcQQX7SBfqXsH9w/exec';

    let currentUser = null;

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();
      const btn = e.target.querySelector('button');
      btn.innerText = 'Mengecek Data...';
      btn.disabled = true;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getUsers`);
        const users = await res.json();

        // Cek pencocokan ID/Username dan Password
        const validUser = users.find(user => 
          (String(user.username) === u || String(user.id) === u) && String(user.password) === p
        );

        if (validUser) {
          currentUser = validUser.username;
          alert('Selamat datang, ' + currentUser + '!');
          document.getElementById('page-login').classList.add('hidden');
          document.getElementById('in-header').classList.remove('hidden');
          document.getElementById('page-dashboard').classList.remove('hidden');
          loadStocks();
        } else {
          alert('Username atau Password salah!');
        }
      } catch (err) {
        alert('Gagal terhubung ke Google Sheets!');
        console.error(err);
      } finally {
        btn.innerText = 'Masuk Sistem';
        btn.disabled = false;
      }
    }

    async function loadStocks() {
      const container = document.getElementById('stock-list');
      container.innerHTML = '<tr><td class="p-2 text-amber-400">Memuat stok dari Spreadsheet...</td></tr>';
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getStocks`);
        const data = await res.json();
        
        if (!data || data.length <= 1) {
          container.innerHTML = '<tr><td class="p-2 text-slate-400">Belum ada data stok.</td></tr>';
          return;
        }

        let html = '';
        for (let i = 1; i < data.length; i++) {
          html += `<tr class="border-b border-slate-700/50"><td class="p-2">${data[i].join(' | ')}</td></tr>`;
        }
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<tr><td class="p-2 text-red-400">Gagal mengambil data stok!</td></tr>';
        console.error(err);
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
